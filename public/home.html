<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My GrowMyPin home</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#09423D">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/brand.css">
<link rel="stylesheet" href="/style.css">
<style>
  :root { --night: #061815; --gold: #FFC75A; --mari: #F29A2E; --card: #FFFFFF; }
  body.h-body { background: #F6F5FB; min-height: 100vh; }
  .h-wrap { max-width: 1120px; margin: 0 auto; padding: 22px 16px 70px; display: grid; gap: 18px; }
  .h-nav-r { display: flex; align-items: center; gap: 10px; }
  .h-nav-r a.h-link { font-weight: 700; font-size: .92rem; color: var(--muted); text-decoration: none; }
  .h-nav-r a.h-link:hover { color: var(--green-text); }
  .h-av { width: 36px; height: 36px; border-radius: 50%; background: var(--grad); color: #fff; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; }
  .h-out { background: none; border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 12px; font: inherit; font-weight: 700; font-size: .85rem; cursor: pointer; color: var(--charcoal); }

  .h-card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: clamp(18px, 3vw, 26px); min-width: 0; }
  .h-card h2 { font-size: clamp(1.15rem, 2.4vw, 1.4rem); margin: 0; }
  .h-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .h-muted { color: var(--muted); font-size: .92rem; }
  #pfNudge { color: var(--green-text); font-weight: 700; white-space: nowrap; }

  /* hero */
  .h-hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: stretch; }
  .h-hello { padding: clamp(6px, 2vw, 14px) 4px; display: grid; align-content: center; gap: 10px; }
  .h-hello h1 { font-size: clamp(2rem, 5vw, 3.1rem); line-height: 1.04; }
  .h-hello p { color: var(--muted); font-size: 1.05rem; max-width: 52ch; }
  .h-hello h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  /* rotating motivation card */
  .moti { position: relative; overflow: hidden; border-radius: 22px; padding: 16px 18px 14px; background: linear-gradient(135deg, #FFFFFF 0%, #F6FBF9 60%, #FFF7EA 100%); border: 1px solid var(--line); box-shadow: 0 20px 40px -32px rgba(36,41,47,.45); display: grid; gap: 10px; max-width: 620px; }
  .moti-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .moti-k { display: inline-flex; align-items: center; gap: 7px; font-size: .74rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--green-text); }
  .moti-k i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: livePing 1.6s infinite; }
  .moti-dots { display: flex; gap: 5px; }
  .moti-dots button { width: 7px; height: 7px; padding: 0; border: 0; border-radius: 999px; background: #D9DCE5; cursor: pointer; transition: width .3s, background .3s; }
  .moti-dots button.on { width: 20px; background: var(--green); }
  .moti-body { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; align-items: center; min-height: 74px; }
  .moti-ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--mint); color: var(--green-text); }
  .moti-ic.warm { background: #FFF1DC; color: #B4601A; }
  .moti-ic.vio { background: #EEEAFD; color: #5B4BC4; }
  .moti-ic svg { width: 24px; height: 24px; }
  .moti-tx b { display: block; font-family: var(--f-display); font-size: clamp(1.05rem, 2.3vw, 1.3rem); letter-spacing: -.02em; line-height: 1.2; color: var(--charcoal); }
  .moti-tx b .n { display: inline; margin: 0; }
  .moti-tx > span { display: block; margin-top: 3px; font-size: .9rem; color: var(--muted); line-height: 1.4; }
  .moti-tx a { color: var(--green-text); font-weight: 700; }
  .moti-in { animation: motiIn .55s cubic-bezier(.2,.8,.2,1); }
  .moti-bar { height: 3px; border-radius: 3px; background: #EEF0F5; overflow: hidden; }
  .moti-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #F2A54A, #14B88F); }
  .moti-bar i.run { animation: motiBar var(--t) linear forwards; }
  .moti-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-width: 620px; }
  .moti-stats div { border-radius: 16px; padding: 10px 12px; background: rgba(255,255,255,.75); border: 1px solid var(--line); display: grid; gap: 1px; }
  .moti-stats b { font-family: var(--f-display); font-size: 1.15rem; letter-spacing: -.02em; color: var(--charcoal); }
  .moti-stats small { font-size: .76rem; color: var(--muted); line-height: 1.3; }
  @keyframes motiIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes motiBar { from { width: 0; } to { width: 100%; } }
  @media (max-width: 560px) { .moti-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; } .moti-stats b { font-size: 1rem; } .moti-stats div { padding: 9px 10px; } }
  @media (prefers-reduced-motion: reduce) { .moti-in { animation: none; } .moti-bar i.run { animation: none; width: 100%; } }
  .h-setup { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
  .ring { width: 92px; height: 92px; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 9; }
  .ring .bg { stroke: var(--lav-deep); }
  .ring .fg { stroke: url(#ringGrad); stroke-linecap: round; transition: stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1); }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: 1.35rem; color: var(--charcoal); }
  .steps-l { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; font-size: .9rem; }
  .steps-l li { display: flex; align-items: center; gap: 9px; min-height: 28px; }
  .steps-l .ck { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
  .steps-l li.ok .ck { background: var(--green); border-color: var(--green); }
  .steps-l li.ok .ck::after { content: ""; width: 8px; height: 4px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
  .steps-l li.ok span { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(89,96,110,.4); }
  .steps-l button, .steps-l a.go { margin-left: auto; border: 0; background: var(--mint); color: var(--green-text); font: inherit; font-weight: 700; font-size: .8rem; padding: 5px 11px; border-radius: 999px; cursor: pointer; text-decoration: none; white-space: nowrap; }

  /* offer banner */
  .h-offer { position: relative; overflow: hidden; border-radius: 22px; padding: 18px 20px; color: #fff; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: radial-gradient(70% 160% at 0% 110%, rgba(242,154,46,.5) 0, rgba(140,60,120,.25) 40%, transparent 70%), linear-gradient(120deg, #0E0B33 0%, #1E1557 45%, #3A1F73 100%); box-shadow: 0 24px 50px -30px rgba(30,21,87,.8); }
  .h-offer > *:not(.gmp-sky) { position: relative; z-index: 1; }
  .h-offer .gmp-sky .gsk-m { right: auto; left: 46%; top: 12px; }
  .h-offer .tx span { color: #E6E0FF !important; }
  .h-offer .flame { width: 14px; height: 22px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; background: radial-gradient(circle at 50% 72%, #FFFBE6 0, #FFE08A 30%, var(--mari) 75%); box-shadow: 0 0 22px 6px rgba(255,199,90,.45); flex: none; animation: hflick 1.2s ease-in-out infinite alternate; }
  .h-offer .tx { flex: 1; min-width: 220px; }
  .h-offer .tx b { display: block; font-family: var(--f-display); font-size: 1.12rem; letter-spacing: -.02em; color: var(--gold); }
  .h-offer .tx span { color: #D9E7E3; font-size: .95rem; }
  .h-offer .cd { font-family: var(--f-mono); font-size: .9rem; color: #F4E7CF; background: rgba(255,255,255,.08); border: 1px solid rgba(255,199,90,.25); border-radius: 12px; padding: 8px 12px; white-space: nowrap; }
  .btn-gold { background: linear-gradient(135deg, #FFE08A, var(--gold) 40%, var(--mari)); color: #2A1503; box-shadow: 0 14px 30px -14px rgba(242,154,46,.9); }
  .btn-gold:hover { transform: translateY(-2px); }
  .h-offer.done { background: linear-gradient(135deg, #09423D, #0F8A76 70%, #14B88F); }
  .h-offer.done .tx b { color: #fff; }

  /* store + goal */
  .h-row { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; }
  .shops { display: grid; gap: 10px; }
  .shop { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; background: #FAFAFD; border: 1px solid #EEF0F5; }
  .shop .ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--mint); color: var(--green-text); font-family: var(--f-display); font-weight: 800; }
  .shop .ic.etsy { background: #FFE9DC; color: #B84A12; }
  .shop .ic.ebay { background: #E6ECFF; color: #3348A8; }
  .shop .ic.shopify { background: #E3F5E7; color: #1E7A3A; }
  .shop b { display: block; font-family: var(--f-display); font-size: 1rem; }
  .shop .u { font-size: .85rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .shop a.open { font-weight: 700; font-size: .85rem; color: var(--green-text); white-space: nowrap; }
  .h-form { display: grid; gap: 12px; }
  .h-form label { display: grid; gap: 6px; font-weight: 700; font-size: .88rem; color: var(--charcoal); }
  .h-form input { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 13px; font: inherit; background: #fff; width: 100%; }
  .h-form input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 4px rgba(15,150,130,.15); }
  .pchips { display: flex; gap: 8px; flex-wrap: wrap; }
  .pchip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 700; cursor: pointer; color: var(--muted); }
  .pchip.on { background: var(--charcoal); color: #fff; border-color: var(--charcoal); }
  .h-err { color: #C02D52; font-weight: 600; font-size: .88rem; min-height: 1.2em; }
  .linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--green-text); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .goal { display: grid; gap: 12px; }
  .goal-big { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.2rem, 5vw, 3rem); letter-spacing: -.04em; line-height: 1; color: var(--charcoal); }
  .goal-big small { font-size: .38em; letter-spacing: 0; color: var(--muted); font-weight: 700; margin-left: 6px; }
  .gbars { display: grid; gap: 8px; }
  .bar-r { display: grid; grid-template-columns: 74px 1fr 60px; gap: 10px; align-items: center; font-size: .82rem; color: var(--muted); font-weight: 600; }
  .bar-r i { display: block; height: 10px; border-radius: 6px; background: var(--lav); overflow: hidden; position: relative; }
  .bar-r i::after { content: ""; position: absolute; inset: 0; width: var(--w, 0%); background: var(--grad); border-radius: 6px; transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
  .bar-r.goal-r i::after { background: linear-gradient(90deg, #FFE08A, var(--mari)); }
  .bar-r b { text-align: right; color: var(--charcoal); }

  /* pins */
  .pins { columns: 4 170px; column-gap: 12px; }
  .pin-c { break-inside: avoid; margin: 0 0 12px; display: block; border-radius: 16px; overflow: hidden; background: var(--lav); text-decoration: none; color: var(--ink); position: relative; opacity: 0; transform: translateY(14px); animation: hrise .6s cubic-bezier(.2,.8,.2,1) forwards; }
  .pin-c img { display: block; width: 100%; height: auto; min-height: 120px; object-fit: cover; transition: transform .5s ease; }
  .pin-c:hover img { transform: scale(1.04); }
  .pin-c span { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 10px 9px; font-size: .78rem; font-weight: 600; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.65)); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .src { display: inline-flex; align-items: center; gap: 7px; font-size: .82rem; font-weight: 700; color: var(--green-text); background: var(--mint); padding: 5px 11px; border-radius: 999px; }
  .src i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: livePing 1.6s infinite; }
  .empty { display: grid; justify-items: center; text-align: center; gap: 12px; padding: 26px 10px; border: 2px dashed var(--line); border-radius: 18px; }
  .empty .ghost { display: flex; gap: 8px; }
  .empty .ghost i { width: 46px; border-radius: 10px; background: linear-gradient(180deg, var(--lav), var(--lav-deep)); }
  .empty .ghost i:nth-child(1) { height: 70px; } .empty .ghost i:nth-child(2) { height: 92px; } .empty .ghost i:nth-child(3) { height: 60px; }

  /* prediction (the forecast widget itself lives in /gmp-growth.js) */
  .pred { display: grid; gap: 12px; scroll-margin-top: 80px; }
  .pred-cta { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; padding: 16px 18px; border-radius: 22px; background: linear-gradient(135deg, #FFF6E3, #F1EEFB 55%, #E6F6F0); border: 1px solid #F3E2BD; }
  .pred-cta p { flex: 1; min-width: 220px; font-weight: 600; color: var(--charcoal); }
  .pred-cta p b { display: block; font-family: var(--f-display); font-size: 1.12rem; letter-spacing: -.02em; }
  .h-ok { font-weight: 700; color: var(--green-text); }
  .fine { font-size: .78rem; color: var(--muted); margin-top: 10px; }

  /* how */
  .how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .how li { list-style: none; background: #FAFAFD; border: 1px solid #EEF0F5; border-radius: 18px; padding: 16px; display: grid; gap: 6px; }
  .how ol { margin: 0; padding: 0; display: contents; }
  .how .n { width: 30px; height: 30px; border-radius: 50%; background: var(--charcoal); color: #fff; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: .9rem; }
  .how b { font-family: var(--f-display); font-size: 1rem; color: var(--charcoal); }
  .how span { color: var(--muted); font-size: .9rem; }

  .skel { background: linear-gradient(90deg, #EEF0F5 25%, #F7F8FB 50%, #EEF0F5 75%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; border-radius: 12px; color: transparent !important; }
  .h-load { min-height: 60vh; display: grid; place-items: center; }
  @keyframes hrise { to { opacity: 1; transform: none; } }
  @keyframes hflick { from { transform: scale(1) rotate(-2deg); } to { transform: scale(.94, 1.06) rotate(2deg); } }

  @media (max-width: 900px) {
    .h-hero, .h-row { grid-template-columns: 1fr; }
    .how { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .h-nav-r a.h-link.hide-sm { display: none; }
    .h-setup { grid-template-columns: 1fr; justify-items: start; }
    .ring { width: 78px; height: 78px; }
    .pins { columns: 2 140px; column-gap: 10px; }
    .shop { grid-template-columns: 40px minmax(0, 1fr); }
    .shop .ic { width: 40px; height: 40px; }
    .shop a.open { grid-column: 2; }
    .h-offer .cd { order: 3; }
  }

  /* ---------- motion and life ---------- */
  .h-hero { position: relative; isolation: isolate; }
  .h-hero > * { position: relative; z-index: 1; }
  .floaters { position: absolute; inset: -30px -10px 0; z-index: 0 !important; pointer-events: none; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, transparent, #000 18%, #000 75%, transparent); mask-image: linear-gradient(180deg, transparent, #000 18%, #000 75%, transparent); }
  .floaters i { position: absolute; bottom: -120px; width: var(--w); height: var(--h); border-radius: 12px; background: var(--bg); opacity: .55; box-shadow: 0 10px 20px -14px rgba(36,41,47,.35); animation: flUp var(--t) linear infinite; animation-delay: var(--d); }
  .floaters i::after { content: ""; position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: #E60023; opacity: .55; }
  .sparks { position: absolute; inset: 0; z-index: 0 !important; pointer-events: none; }
  .sparks b { position: absolute; width: 14px; height: 14px; background: radial-gradient(circle, #FFC75A 0 18%, transparent 20%), linear-gradient(0deg, transparent 44%, #F2A54A 44% 56%, transparent 56%), linear-gradient(90deg, transparent 44%, #F2A54A 44% 56%, transparent 56%); opacity: 0; animation: spark 3.2s ease-in-out infinite; animation-delay: var(--d); }
  .h-hello h1 .w { display: inline-block; opacity: 0; transform: translateY(18px) rotate(2deg); animation: wIn .7s cubic-bezier(.2,.8,.2,1) forwards; }
  .h-hello h1 em { background: linear-gradient(90deg, #09423D, #0F8A76, #14B88F, #F2A54A, #0F8A76); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 6s ease-in-out infinite; }
  .moti { transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s; }
  .moti:hover { transform: translateY(-2px); box-shadow: 0 26px 50px -30px rgba(15,150,130,.45); }
  .moti::after { content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 30%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent); transform: skewX(-18deg); pointer-events: none; }
  .moti.shine::after { animation: shine 1s ease; }
  .moti-ic { animation: icPop .55s cubic-bezier(.2,1.6,.4,1); }
  .moti-ic svg { animation: icFloat 3s ease-in-out infinite; }
  .moti-tx b .n { background: linear-gradient(135deg, #0F8A76, #14B88F); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .moti-ic.warm + .moti-tx b .n { background: linear-gradient(135deg, #B4601A, #F2A54A); -webkit-background-clip: text; background-clip: text; }
  .moti-ic.vio + .moti-tx b .n { background: linear-gradient(135deg, #5B4BC4, #8C7CF0); -webkit-background-clip: text; background-clip: text; }
  .moti-stats div { opacity: 0; transform: translateY(10px) scale(.97); animation: wIn .6s cubic-bezier(.2,.8,.2,1) forwards; transition: transform .3s, border-color .3s; }
  .moti-stats div:hover { transform: translateY(-3px); border-color: #BDE8DA; }
  .moti-stats div:nth-child(1) { animation-delay: .5s; } .moti-stats div:nth-child(2) { animation-delay: .62s; } .moti-stats div:nth-child(3) { animation-delay: .74s; }
  .steps-l li.ok .ck { animation: icPop .5s cubic-bezier(.2,1.6,.4,1) both; }
  .steps-l li { opacity: 0; transform: translateX(10px); animation: wIn .5s cubic-bezier(.2,.8,.2,1) forwards; }
  .ring.full { animation: ringGlow 2s ease-in-out infinite; border-radius: 50%; }
  .rv { opacity: 0; transform: translateY(26px); transition: opacity .7s cubic-bezier(.2,.8,.2,1), transform .7s cubic-bezier(.2,.8,.2,1); }
  .rv.in { opacity: 1; transform: none; }
  .h-card { transition: box-shadow .35s, transform .35s; }
  .h-card:hover { box-shadow: 0 24px 50px -36px rgba(36,41,47,.4); }
  .how { position: relative; }
  .how .n { background: var(--grad); box-shadow: 0 0 0 0 rgba(20,184,143,.4); }
  .how.in li { animation: wIn .6s cubic-bezier(.2,.8,.2,1) both; }
  .how.in li:nth-child(1) { animation-delay: .1s; } .how.in li:nth-child(2) { animation-delay: .3s; } .how.in li:nth-child(3) { animation-delay: .5s; }
  .how.in li .n { animation: numPing 2.4s ease-out infinite; }
  .how.in li:nth-child(2) .n { animation-delay: .8s; } .how.in li:nth-child(3) .n { animation-delay: 1.6s; }
  .pred-cta { position: relative; overflow: hidden; }
  .pred-cta::before { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.7) 50%, transparent 70%); background-size: 250% 100%; animation: ctaSweep 4.5s ease-in-out infinite; pointer-events: none; }
  .pred-cta > * { position: relative; }
  .pred-cta .btn-gold { animation: ctaPulse 2.6s ease-in-out infinite; }
  .confetti-c { position: fixed; inset: 0; pointer-events: none; z-index: 300; }
  @keyframes flUp { 0% { transform: translate(0, 0) rotate(-4deg); } 50% { transform: translate(14px, -320px) rotate(3deg); } 100% { transform: translate(-6px, -640px) rotate(-3deg); } }
  @keyframes spark { 0%, 100% { opacity: 0; transform: scale(.4) rotate(0); } 50% { opacity: .9; transform: scale(1) rotate(45deg); } }
  @keyframes wIn { to { opacity: 1; transform: none; } }
  @keyframes shimmer { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  @keyframes shine { from { left: -40%; } to { left: 130%; } }
  @keyframes icPop { from { transform: scale(.4) rotate(-12deg); } to { transform: none; } }

<script src="/pins.js"></script>
<script src="/gmp-growth.js"></script>

<script>
(function () {
  function $(id) { return document.getElementById(id); }
  var GR = window.GMPGrowth;
  var NAMES = GR.NAMES;
  var D = null, ST = {}, P = { tab: 0, range: 3, items: [] };

  async function api(p, body) {
    var o = { credentials: "same-origin", headers: {} };
    if (body) { o.method = "POST"; o.headers["Content-Type"] = "application/json"; o.body = JSON.stringify(body); }
    var r = await fetch(p, o);
    var j = {}; try { j = await r.json(); } catch (e) {}
    if (!r.ok) { var err = new Error(j.error || "Request failed (" + r.status + ")"); err.status = r.status; throw err; }
    return j;
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]; }); }
  function first() { return ((D && D.user.name) || "").split(" ")[0]; }
  function tpl(t) { return String(t || "").replace(/\{offer\}/g, ST.offer_name || "").replace(/\{percent\}/g, ST.offer_percent || "").replace(/\{first\}/g, first() || "you"); }
  function shortUrl(u) { try { var x = new URL(u); return x.hostname.replace(/^www\./, "") + (x.pathname.length > 1 ? x.pathname.replace(/\/$/, "") : ""); } catch (e) { return u; } }
  function mainPlatform() { return GR.pickPlatform(D.profile.platforms) || ""; }
  function storeName() { var p = mainPlatform(); return p ? NAMES[p] : "online"; }

  $("logout").onclick = async function () {
    try { await fetch("/api/user/logout", { method: "POST", credentials: "same-origin" }); } catch (e) {}
    document.cookie = "gmp_in=; Max-Age=0; path=/";
    location.href = "/?landing=1";
  };

  // ---------------- profile nudge (the full checklist lives on /profile.html) ----------------
  function renderNudge() {
    var s = D.profile_steps || { pct: 100 };
    var a = $("pfNudge"); if (!a) return;
    if (s.pct >= 100) { a.hidden = true; return; }
    a.hidden = false;
    a.textContent = "Your profile is " + s.pct + "% complete. Finish it";
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b) return;
    if (b.getAttribute("data-act") === "shop") { e.preventDefault(); location.href = "/profile.html#store"; }
  });

  // ---------------- offer banner ----------------
  var cdT = null;
  function renderOffer() {
    var box = $("offerBox");
    box.innerHTML = "";
    var pr = D.profile;
    if (pr.offer_status === "submitted") {
      box.innerHTML = '<div class="h-offer done"><span class="flame" aria-hidden="true"></span><div class="tx"><b>' + esc(ST.offer_active ? "Your " + ST.offer_name + " slot is reserved" : "Your growth slot is reserved") + '</b><span>We will message you on WhatsApp at ' + esc(D.user.phone || "your number") + ' to get started.</span></div></div>';
      return;
    }
    if (!ST.offer_active || !ST.home_banner_enabled) return;
    box.innerHTML = '<div class="h-offer"><span class="flame" aria-hidden="true"></span><div class="tx"><b>' + esc(ST.offer_name) + ': up to ' + esc(ST.offer_percent) + '% off</b><span>' + esc(tpl(ST.home_banner_text)) + '</span></div><span class="cd" id="cd"></span><a class="btn btn-gold" href="/signup.html#offer">' + esc(ST.offer_reserve_btn) + '</a></div>';
    skyOn(box.querySelector(".h-offer"));
    var end = new Date(ST.offer_end).getTime();
    function tick() {
      var s = Math.floor((end - Date.now()) / 1000);
      var el = $("cd"); if (!el) return;
      if (!(s > 0)) { el.style.display = "none"; return; }
      var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
      el.textContent = (d ? d + "d " : "") + h + "h " + m + "m " + (sec < 10 ? "0" : "") + sec + "s left";
    }
    tick(); clearInterval(cdT); cdT = setInterval(tick, 1000);
  }

  // ---------------- goal ----------------
  // the forecast: their current monthly views + the graph of their niche (set in Admin > Growth graph)
  function growthInput() {
    var pr = D.profile, pin = D.pinterest;
    return { niche: pr.niche || "", platform: mainPlatform() || "etsy", current: pin.views30 || 0 };
  }
  // ---------------- pinterest ----------------
  function renderPins() {
    var pin = D.pinterest, pr = D.profile;
    var acts = $("pinActions"); acts.innerHTML = "";
    if (pin.connected) {
      $("pinSub").innerHTML = '<span class="src"><i></i>Live from @' + esc(pin.username) + '</span>' + (pin.views30 != null ? ' <span class="h-muted" style="margin-left:6px">' + GR.fmt(pin.views30) + ' views in the last 30 days</span>' : "");
      acts.innerHTML = '<a class="btn btn-primary btn-sm" href="/app.html">Make new pins</a>';
    } else {
      $("pinSub").innerHTML = pin.source === "profile" ? '<span class="src"><i></i>From your public profile' + (pin.link_user ? " @" + esc(pin.link_user) : "") + '</span>' : "Connect to see your pins and real views here";
      acts.innerHTML = '<a class="btn btn-primary btn-sm" href="/api/auth/login?next=/home.html">Connect Pinterest</a>';
    }
    if (pin.pins && pin.pins.length) {
      $("pinBody").innerHTML = '<div class="pins">' + pin.pins.map(function (p, i) {
        var inner = '<img src="' + esc(p.img) + '" alt="' + esc(p.title || "Pin") + '" loading="lazy" referrerpolicy="no-referrer">' + (p.title ? '<span>' + esc(p.title) + '</span>' : "");
        return p.url ? '<a class="pin-c" style="animation-delay:' + (i * 60) + 'ms" href="' + esc(p.url) + '" target="_blank" rel="noopener noreferrer">' + inner + '</a>' : '<div class="pin-c" style="animation-delay:' + (i * 60) + 'ms">' + inner + '</div>';
      }).join("") + '</div>';
      Array.prototype.forEach.call(document.querySelectorAll(".pin-c img"), function (im) {
        im.onerror = function () {
          var c = im.closest(".pin-c"); if (c) c.remove();
          if (!document.querySelector(".pin-c")) { D.pinterest.pins = []; renderPins(); }
        };
      });
      return;
    }
    var msg = pr.pinterest_url
      ? "We could not load pins from " + esc(shortUrl(pr.pinterest_url)) + ". The profile may be private or new. Connect Pinterest to show your pins here."
      : "No pins to show yet. Connect your Pinterest account, or add your Pinterest link in <a href=\"/profile.html#store\">your profile</a>.";
    $("pinBody").innerHTML = '<div class="empty"><div class="ghost" aria-hidden="true"><i></i><i></i><i></i></div><p class="h-muted" style="max-width:46ch">' + msg + '</p></div>';
  }

  // ---------------- prediction (widget from /gmp-growth.js) ----------------
  var GW = null;
  function renderPred() {
    var inp = growthInput();
    if (!GW) GW = GR.mount($("gwBox"), inp, {});
    else GW.update(inp);
    var store = D.profile.platforms && D.profile.platforms.length ? NAMES[inp.platform] : "online";
    if ($("ctaBtn") && !D.plans) $("ctaBtn").textContent = "Increase my " + store + " store visits";
    if (D.profile.interest_at && !D.plans) setInterestDone();
  }
  // ---------------- plans (only after Pinterest is connected, from /gmp-plans.js) ----------------
  function planCtx() {
    return {
      plans: D.plans, billing: D.billing || {}, user: D.user, pinterest: D.pinterest,
      P: GR.plan(growthInput()), store: storeName(), preview: !!D.plans_preview,
      onPaid: function (b) { D.billing = b; renderPlans(); }
    };
  }
  function renderPlans() {
    var box = $("planBox");
    if (!box || !window.GMPPlans) return;
    if (!D.plans) { box.hidden = true; box.innerHTML = ""; return; }
    window.GMPPlans.section(box, planCtx());
    var cta = $("predCta");
    if (D.billing && D.billing.active) {
      cta.innerHTML = '<p class="h-ok"><b>Your ' + esc(D.billing.plan_name) + ' plan is active.</b>Approve your pins and we keep growing these numbers.</p><a class="btn btn-primary" href="/app.html">Open Pin Studio</a>';
    } else {
      $("ctaTxt").innerHTML = "<b>Your Pinterest is connected.</b>Pick a plan and we start growing your account.";
      $("ctaBtn").textContent = "See my plans";
      $("ctaBtn").onclick = function () { box.scrollIntoView({ behavior: "smooth", block: "start" }); };
    }
  }
  function maybeReveal() {
    if (!D.plans || !window.GMPPlans) return;
    var q = location.search;
    var key = "gmp_reveal_" + (D.user.email || "");
    var seen = false;
    try { seen = !!localStorage.getItem(key); } catch (e) {}
    var force = /[?&]connected=1/.test(q) || /[?&]plans=preview/.test(q) || /[?&]open=1/.test(q);
    if (D.billing && D.billing.active && !/[?&]plans=preview/.test(q)) return;
    if (!force && seen) return;
    try { localStorage.setItem(key, String(Date.now())); } catch (e) {}
    setTimeout(function () { window.GMPPlans.reveal(planCtx(), /[?&]open=1/.test(q) ? 3 : 1); }, 700);
  }

  function setInterestDone() {
    $("predCta").innerHTML = '<p class="h-ok"><b>You are on the list.</b>We will start growing your shop. Our team will WhatsApp you within 24 hours.</p>' +
      (ST.sales_whatsapp ? '<a class="btn btn-primary" target="_blank" rel="noopener" href="https://wa.me/' + ST.sales_whatsapp.replace(/\D/g, "") + '?text=' + encodeURIComponent("Hi GrowMyPin, I want to increase my store visits.") + '">Chat now on WhatsApp</a>' : "");
  }
  function wireSeg() {
    $("ctaBtn").onclick = async function () {
      var btn = this; btn.disabled = true; btn.textContent = "Saving";
      try { await api("/api/user/hub", { action: "interest", source: "home" }); D.profile.interest_at = new Date().toISOString(); setInterestDone(); }
      catch (e) { btn.disabled = false; btn.textContent = "Try again"; }
    };
  }

  // ---------------- greeting + rotating motivation (changes with time of day and day) ----------------
  function slot() { var h = new Date().getHours(); return h < 5 ? "night" : h < 12 ? "morning" : h < 17 ? "afternoon" : h < 21 ? "evening" : "night"; }
  function greet() { return { morning: "Good morning", afternoon: "Good afternoon", evening: "Good evening", night: "Working late" }[slot()]; }
  var IC = {
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>',
    bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>',
    gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8S10 3 7.5 4.5 9 8 12 8zm0 0s2-5 4.5-3.5S15 8 12 8z"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-6M8 3h8l-1 6 3 4H6l3-4z"/></svg>',
    flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h12l-2 4 2 4H5"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>'
  };
  function nyHour() {
    try { return Number(new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "numeric", hour12: false }).format(new Date())) % 24; } catch (e) { return -1; }
  }
  function seasonMsg(m) {
    if (m === 9 || m === 10) return { ic: "gift", c: "warm", t: "Holiday buyers are searching gifts right now", s: "Pinterest gift searches run weeks ahead of Black Friday and Christmas. Pins posted now catch that wave." };
    if (m === 11) return { ic: "gift", c: "warm", t: "Last-minute gift hunters are on Pinterest", s: "December buyers want quick, ready gifts. Your shop can be the answer they save." };
    if (m === 0) return { ic: "star", c: "vio", t: "New year, new buyers, new searches", s: "Fresh-start and home refresh searches jump in January. A great month to plant new pins." };
    if (m === 1) return { ic: "gift", c: "warm", t: "Valentine's gift season is on", s: "Gifts for her, for him and for couples lead February searches." };
    if (m >= 2 && m <= 4) return { ic: "gift", c: "warm", t: "Mother's Day and spring planning season", s: "Buyers plan spring gifts and home refreshes on Pinterest weeks in advance." };
    if (m >= 5 && m <= 7) return { ic: "clock", c: "vio", t: "Plant pins now, harvest in the holidays", s: "Pins keep bringing views for months. Summer pins grow into the autumn and holiday rush." };
    return { ic: "gift", c: "warm", t: "Early holiday planners have started", s: "September is when Pinterest users begin saving Christmas and gift ideas." };
  }
  function buildMoti() {
    var pr = D.profile, pin = D.pinterest;
    var P = GR.plan(growthInput()), v = P.views;
    var store = NAMES[mainPlatform()] || "online";
    var name = first() || "you";
    var v3 = GR.total(v, 3), v6 = GR.total(v, 6);
    var list = [];
    if (pin.views30 != null) {
      list.push({ ic: "eye", t: GR.fmt(pin.views30) + " views on your pins in the last 30 days", s: "That is " + GR.fmt(pin.views30) + " chances for a buyer to find your " + store + " shop, " + name + "." });
      list.push({ ic: "up", t: "Next stop: " + GR.fmt(v[3]) + " views a month by month 3", s: "Your monthly views can grow from " + GR.fmt(pin.views30) + " to " + GR.fmt(v[3]) + "." });
    } else if (pr.pinterest_url) {
      list.push({ ic: "eye", t: "Your Pinterest is live, " + name, s: (pin.source === "profile" ? "Your latest pins are showing below. " : "") + "<a href=\"/api/auth/login?next=/home.html\">Connect Pinterest</a> to see your real monthly views here." });
    } else {
      list.push({ ic: "pin", t: "Add your Pinterest link to see your views", s: "Then this card shows how many people saw your pins this month. <a href=\"/profile.html#store\">Add it now</a>" });
    }
    var pc = pin.pin_count != null ? pin.pin_count : pr.pins_count;
    if (pc) list.push({ ic: "pin", t: GR.fmtFull(pc) + " pins are working for you day and night", s: "Every pin is a small shop window. It keeps bringing views for months after you post it." });
    list.push({ ic: "up", t: GR.fmt(v3) + " Pinterest views in your next 3 months", s: "Patience first, then reward: month 3 alone can bring " + GR.fmt(v[3]) + " views." });
    list.push({ ic: "up", c: "warm", t: GR.fmt(v[6]) + " views a month by month 6", s: "About " + GR.fmt(v6) + " views in total over 6 months, step by step." });
    list.push(seasonMsg(new Date().getMonth()));
    var ny = nyHour();
    if (ny >= 7 && ny <= 23) list.push({ ic: "clock", c: "vio", t: "It is " + (ny % 12 || 12) + (ny < 12 ? " am" : " pm") + " in New York right now", s: "US buyers are scrolling Pinterest. Your pins can be in front of them today." });
    else list.push({ ic: "clock", c: "vio", t: "US buyers are asleep, your pins are not", s: "Pins posted now are ready when New York wakes up in a few hours." });
    var wd = new Date().getDay();
    if (wd === 0 || wd === 6) list.push({ ic: "star", t: "Weekend scrolling is on", s: "People plan buys on Pinterest over the weekend. Make sure your products are there." });
    else list.push({ ic: "star", t: { morning: "Fresh day, fresh pins, " + name, afternoon: "Small steps today, big numbers in 3 months", evening: "Your shop grew a little more today", night: "Big shops are built one pin at a time" }[slot()], s: "Consistency wins on Pinterest. Every day of pins adds to next month's views." });
    // order changes with the day and the time of day
    var seed = new Date().toDateString() + "|" + slot(), h = 0;
    for (var k = 0; k < seed.length; k++) h = (h * 31 + seed.charCodeAt(k)) >>> 0;
    var first0 = list.shift();
    for (var j = list.length - 1; j > 0; j--) { h = (h * 1103515245 + 12345) >>> 0; var r = h % (j + 1); var tt = list[j]; list[j] = list[r]; list[r] = tt; }
    list.unshift(first0);
    var stats = pin.views30 != null
      ? [[GR.fmt(pin.views30), "Pinterest views, last 30 days"], [GR.fmt(v[3]), "views a month by month 3"], [GR.fmt(v[6]), "views a month by month 6"]]
      : [[GR.fmt(v[3]), "views a month by month 3"], [GR.fmt(v3), "views in 3 months"], [GR.fmt(v[6]), "views a month by month 6"]];
    return { list: list, stats: stats };
  }
  var MT = { i: 0, timer: null, list: [], paused: false };
  function showMoti(i) {
    var L = MT.list; if (!L.length) return;
    MT.i = (i + L.length) % L.length;
    var m = L[MT.i];
    var title = esc(m.t).replace(/(^|[^#\w])(\d[\d,.]*\s?[KM%]?\+?)/g, '$1<span class="n">$2</span>');
    $("motiBody").innerHTML = '<span class="moti-ic ' + (m.c || "") + '">' + IC[m.ic] + '</span><div class="moti-tx moti-in"><b>' + title + '</b><span>' + m.s + '</span></div>';
    var mo = $("moti"); mo.classList.remove("shine"); void mo.offsetWidth; mo.classList.add("shine");
    Array.prototype.forEach.call(document.querySelectorAll("#motiDots button"), function (d, k) { d.classList.toggle("on", k === MT.i); });
    var bar = $("motiBar"); bar.classList.remove("run"); void bar.offsetWidth; bar.style.setProperty("--t", "7s"); if (!MT.paused) bar.classList.add("run");
    clearTimeout(MT.timer);
    if (!MT.paused) MT.timer = setTimeout(function () { showMoti(MT.i + 1); }, 7000);
  }
  function renderMoti() {
    if (!$("moti")) return;
    var r = buildMoti();
    MT.list = r.list;
    $("motiK").textContent = "Your news for " + ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][new Date().getDay()];
    $("motiDots").innerHTML = r.list.map(function (x, k) { return '<button type="button" aria-label="Message ' + (k + 1) + '"></button>'; }).join("");
    $("motiStats").innerHTML = r.stats.map(function (x) { return '<div><b>' + esc(x[0]) + '</b><small>' + esc(x[1]) + '</small></div>'; }).join("");
    showMoti(MT.i || 0);
  }
  document.addEventListener("click", function (e) {
    var d = e.target.closest("#motiDots button");
    if (d) { var k = Array.prototype.indexOf.call(d.parentNode.children, d); showMoti(k); }
  });
  document.addEventListener("mouseover", function (e) { if (e.target.closest && e.target.closest("#moti") && !MT.paused) { MT.paused = true; clearTimeout(MT.timer); $("motiBar").classList.remove("run"); } });
  document.addEventListener("mouseout", function (e) { if (e.target.closest && e.target.closest("#moti") && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("#moti"))) { MT.paused = false; showMoti(MT.i); } });

  // ---------------- motion helpers ----------------
  var RM = false;
  try { RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
  function skyOn(el) {
    if (!el) return;
    if (window.GMPSky) { window.GMPSky(el); return; }
    var tries = 0, t = setInterval(function () { if (window.GMPSky || ++tries > 20) { clearInterval(t); if (window.GMPSky && el.isConnected) window.GMPSky(el); } }, 250);
  }
  function startFX() {
    var f = $("floaters");
    if (f && !RM) {
      var cols = ["linear-gradient(160deg,#E6F6F0,#BFEADB)", "linear-gradient(160deg,#F1EEFB,#DCD3FA)", "linear-gradient(160deg,#FFF1DC,#FFD9A8)", "linear-gradient(160deg,#FDE7EC,#F8C7D3)", "linear-gradient(160deg,#E6F0FF,#C8DCFA)"];
      var h = "";
      for (var i = 0; i < 10; i++) {
        var w = 34 + Math.round(Math.random() * 22);
        h += '<i style="left:' + (2 + i * 9.6 + Math.random() * 4).toFixed(1) + '%;--w:' + w + 'px;--h:' + Math.round(w * (1.2 + Math.random() * .7)) + 'px;--bg:' + cols[i % cols.length] + ';--t:' + (16 + Math.random() * 10).toFixed(1) + 's;--d:-' + (Math.random() * 20).toFixed(1) + 's"></i>';
      }
      f.innerHTML = h;
    }
    // reveal sections as they scroll in
    var els = document.querySelectorAll("#offerBox, #predCard, .h-row > .h-card, #pinCard, .h-card .how");
    if (!("IntersectionObserver" in window) || RM) { Array.prototype.forEach.call(els, function (e) { e.classList.add("in"); }); return; }
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (en) {
        if (!en.isIntersecting) return;
        en.target.classList.add("in");
        io.unobserve(en.target);
      });
    }, { threshold: 0.12 });
    Array.prototype.forEach.call(els, function (e) {
      if (!e.classList.contains("how")) e.classList.add("rv");
      var r = e.getBoundingClientRect();
      if (r.top < window.innerHeight * 0.92) { requestAnimationFrame(function () { e.classList.add("in"); }); } else io.observe(e);
    });
  }
  function confetti() {
    if (RM) return;
    var c = document.createElement("canvas"); c.className = "confetti-c"; document.body.appendChild(c);
    var x = c.getContext("2d"), W = c.width = innerWidth, H = c.height = innerHeight, P = [];
    var cols = ["#14B88F", "#FFC75A", "#F29A2E", "#8C7CF0", "#FF7A93"];
    for (var i = 0; i < 140; i++) P.push({ x: W / 2, y: H / 3, vx: (Math.random() - .5) * 14, vy: Math.random() * -12 - 3, r: Math.random() * 6 + 3, c: cols[i % 5], a: Math.random() * 6 });
    var t0 = performance.now();
    (function fr(t) {
      x.clearRect(0, 0, W, H);
      P.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.vy += .35; p.vx *= .99; p.a += .2; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); });
      if (t - t0 < 2600) requestAnimationFrame(fr); else c.remove();
    })(t0);
  }

  function renderAll(again) {
    var words = (greet() + (first() ? ",|<em>" + esc(first()) + "</em>" : "") + "|<br>|here|is|your|growth").split(/[| ]/);
    var di = 0;
    $("hi").innerHTML = words.map(function (w) {
      if (w === "<br>") return "<br>";
      if (!w) return "";
      var safe = w.indexOf("<em>") === 0 ? w : esc(w);
      return '<span class="w" style="animation-delay:' + (0.08 + 0.09 * di++).toFixed(2) + 's">' + safe + '</span>';
    }).join(" ").replace(/ <br> /g, "<br>");
    if (!again) startFX();
    renderMoti();
    $("av").textContent = (first() || D.user.email || "G").charAt(0).toUpperCase();
    renderNudge(); renderOffer(); renderPins(); renderPred();
    if (!again) wireSeg();
    renderPlans();
  }

  (async function boot() {
    try {
      var qs = [];
      if (/[?&]plans=preview/.test(location.search)) qs.push("plans=preview");
      try { if (localStorage.getItem("gmp_pay_pending")) qs.push("paycheck=1"); } catch (e) {}
      D = await api("/api/user/home" + (qs.length ? "?" + qs.join("&") : ""));
      if (D.billing && D.billing.active) { try { localStorage.removeItem("gmp_pay_pending"); } catch (e) {} }
    } catch (e) {
      if (e.status === 401) { document.cookie = "gmp_in=; Max-Age=0; path=/"; location.replace("/signup.html#login"); return; }
      $("main").innerHTML = '<div class="h-card" style="text-align:center"><h2>Could not load your home</h2><p class="h-muted" style="margin:8px 0 14px">' + esc(e.message) + '</p><button class="btn btn-primary" onclick="location.reload()">Try again</button></div>';
      return;
    }
    ST = D.settings || {};
    GR.setConfig(ST.growth);
    $("main").innerHTML = "";
    $("main").appendChild($("tpl").content.cloneNode(true));
    renderAll(false);
    maybeReveal();
    if (/[?&]connected=1/.test(location.search)) {
      try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}
    }
    // came back from "Connect Pinterest" while Pinterest connect is not open yet
    if (/[?&]pinterest=soon/.test(location.search)) {
      try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}
      location.replace("/profile.html?pinterest=soon#store");
      return;
    }
  })();
})();
</script>
<script src="/gmp.js" defer></script>
