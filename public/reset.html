<body>
<div class="lg-bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="progress" aria-hidden="true"><i id="prog"></i></div>
<header class="nav">
  <div class="wrap">
    <a class="logo" href="/" aria-label="GrowMyPin Studio home">
      <svg class="logo-mark" viewBox="0 0 136 128" aria-hidden="true"><defs><linearGradient id="gmpArrow" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#09423D"/><stop offset=".55" stop-color="#0F8A76"/><stop offset="1" stop-color="#14B88F"/></linearGradient></defs><path d="M134 0 L110 29 L66 29 C45 29 30 45 30 64 C30 84 44 100 60 105 L39 127 C16 121 0 95 0 64 C0 29 28 0 66 0 Z" fill="#24292F"/><path d="M75 50 L128 50 Q135 50 135 57 L135 120 Q135 127 128 127 L112 127 L112 96 L80 128 L48 128 L97 76 L51 76 Z" fill="url(#gmpArrow)"/></svg>

  </div>
</header>
<div class="flash-zone" id="flash" aria-live="polite"></div>
<main>
  <section class="wrap rp-pane rp-center">
    <div class="rp-card glass rp-wait">
      <span class="eyebrow">Account</span>
      <h2 class="rp-h2">Set a new password</h2>
      <form id="fReset" class="rp-form" novalidate>
        <div class="fld"><label for="np">New password</label><input id="np" type="password" autocomplete="new-password" placeholder="At least 8 characters"></div>
        <div class="fld"><label for="np2">Repeat new password</label><input id="np2" type="password" autocomplete="new-password"></div>
        <button class="btn btn-primary rp-submit" type="submit" id="npBtn">Save new password</button>
      </form>
      <p class="rp-muted rp-small" id="resetNote"></p>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <a class="logo" href="/" aria-label="GrowMyPin Studio home">
      <svg class="logo-mark" viewBox="0 0 136 128" aria-hidden="true"><defs><linearGradient id="gmpArrow" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#09423D"/><stop offset=".55" stop-color="#0F8A76"/><stop offset="1" stop-color="#14B88F"/></linearGradient></defs><path d="M134 0 L110 29 L66 29 C45 29 30 45 30 64 C30 84 44 100 60 105 L39 127 C16 121 0 95 0 64 C0 29 28 0 66 0 Z" fill="#24292F"/><path d="M75 50 L128 50 Q135 50 135 57 L135 120 Q135 127 128 127 L112 127 L112 96 L80 128 L48 128 L97 76 L51 76 Z" fill="url(#gmpArrow)"/></svg>

<script src="/pins.js"></script>
<script>
(function () {
  function $(id) { return document.getElementById(id); }
  var h = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  var token = h.get("access_token") || "";
  if (h.get("error_description")) $("resetNote").textContent = h.get("error_description") + ". Ask for a new reset link from the log in page.";
  else if (!token) $("resetNote").textContent = "Open this page from the reset link in your email.";
  history.replaceState(null, "", "/reset.html");
  $("fReset").addEventListener("submit", async function (e) {
    e.preventDefault();
    var p = $("np").value, p2 = $("np2").value;
    if (p.length < 8) { $("resetNote").textContent = "Password must be at least 8 characters."; return; }
    if (p !== p2) { $("resetNote").textContent = "The two passwords do not match."; return; }
    var btn = $("npBtn");
    btn.disabled = true;
    try {
      var r = await fetch("/api/user/reset", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ access_token: token, password: p }) });
      var d = {};
      try { d = await r.json(); } catch (x) {}
      if (!r.ok) throw new Error(d.error || "Could not save the password.");
      $("resetNote").textContent = "Password saved. Taking you to your reports.";
      setTimeout(function () { location.href = "/report.html"; }, 1000);
    } catch (err) {
      $("resetNote").textContent = err.message;
      btn.disabled = false;
    }
  });
})();
</script>
<script src="/gmp.js" defer></script>
</body>
</html>
