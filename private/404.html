<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 - Page not found | GrowMyPin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#09423D">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Figtree:wght@400;600;700&display=swap">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;color:#1F242B;background:radial-gradient(600px 380px at 10% 0%,#F1EEFB 0,transparent 70%),radial-gradient(520px 420px at 95% 100%,#E6F6F0 0,transparent 70%),#fff;display:grid;place-items:center;padding:24px 16px}
  main{max-width:520px;text-align:center;display:grid;gap:18px;justify-items:center}
  .pin{position:relative;width:150px;height:190px;border-radius:22px;background:linear-gradient(160deg,#0C5A51,#09423D);box-shadow:0 30px 50px -24px rgba(9,66,61,.6);transform:rotate(-7deg);animation:sway 4s ease-in-out infinite;transform-origin:50% 0}
  .pin::before{content:"";position:absolute;left:50%;top:-12px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#F29A2E;box-shadow:inset -3px -3px 0 rgba(0,0,0,.18)}
  .pin b{position:absolute;inset:0;display:grid;place-items:center;font-family:Montserrat,system-ui,sans-serif;font-size:3.2rem;font-weight:800;color:#fff;letter-spacing:-.05em}
  h1{margin:8px 0 0;font-family:Montserrat,system-ui,sans-serif;font-weight:800;font-size:clamp(1.8rem,6vw,2.6rem);letter-spacing:-.03em;color:#24292F;line-height:1.08}
  p{margin:0;color:#59606E;font-size:1.05rem;line-height:1.55}
  a{display:inline-flex;align-items:center;padding:14px 26px;border-radius:999px;background:linear-gradient(135deg,#09423D,#0F8A76 55%,#14B88F);color:#fff;text-decoration:none;font-weight:700;box-shadow:0 12px 26px -12px rgba(9,66,61,.7)}
  @keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(4deg)}}
  @media (prefers-reduced-motion:reduce){.pin{animation:none}}
</style>
</head>
<body>
<main>
  <div class="pin" aria-hidden="true"><b>404</b></div>
  <h1>This page is not on our board</h1>
  <p>The link may be wrong or the page was moved.</p>
  <a href="/">Go to the home page</a>
</main>
</body>
</html>
